  <head>

    <meta name="theme-color" content="#0f766e" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="خدمات الدروة" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="description" content="منصة ودليل خدمات الدروة للحرفيين، العيادات، الطوارئ وإدارة الطلبات" />
    <meta property="og:title" content="Deroua Services - خدمات الدروة" />
    <meta property="og:description" content="منصة ودليل خدمات الدروة للحرفيين، العيادات، الطوارئ وإدارة الطلبات" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      #app-splash img { width: min(72vw, 330px); height: auto; }
      #app-splash.app-splash--hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-500 selection:text-white font-['Tajawal',sans-serif]">
    <div id="app-splash" aria-label="Deroua Services">
      <img src="/deroua-services-logo.png" alt="Deroua Services" />
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var splash = document.getElementById('app-splash');
        if (splash) splash.classList.add('app-splash--hidden');
      }, 700);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
